name: Bug report
description: Report a reproducible NeedWise problem
body:
  - type: textarea
    id: problem
    attributes: { label: What happened?, description: Do not include credentials or personal information. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and version }
